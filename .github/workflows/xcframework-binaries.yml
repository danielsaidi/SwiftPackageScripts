# This workflow builds binaries for a closed-source package.
# The output is an XCFramework zip file and a dSYMs zip file.

# For this to work, you must define these repository secrets:
# - BUILD_CERTIFICATE_BASE64
# - P12_PASSWORD
# - KEYCHAIN_PASSWORD

# OBS! You must also change FRAMEWORK_NAME below to use your
# framework's name.

# For more information see: 
# https://danielsaidi.com/blog/2025/11/09/building-closed-source-binaries-with-github-actions

name: Build XCFramework Binaries

on:
  workflow_dispatch:  # Manual trigger
  # Or add other triggers like:
  # push:
  #   tags:
  #     - 'v*'

jobs:
  build:
    runs-on: macos-15 # macos-latest

    env:
      FRAMEWORK_NAME: CHANGE_THIS_TO_YOUR_FRAMEWORK_NAME    # <-- OBS!

        steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.4 # latest-stable

      - name: Validate Project
        run: ./scripts/validate_release.sh -p iOS --swiftlint 0

      - name: Run release script
        run: ./scripts/framework.sh -p iOS --dsyms 1 --zip 0

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FRAMEWORK_NAME }}
          path: .build/${{ env.FRAMEWORK_NAME }}.xcframework
          if-no-files-found: error

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FRAMEWORK_NAME }}-dSYMs
          path: .build/dSYMs
          if-no-files-found: error
