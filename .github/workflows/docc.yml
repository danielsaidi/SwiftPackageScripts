# This workflow builds and publishes DocC docs to GitHub Pages.

# Source: https://maxxfrazer.medium.com/deploying-docc-with-github-actions-218c5ca6cad5
# Sample: https://github.com/AgoraIO-Community/VideoUIKit-iOS/blob/main/.github/workflows/deploy_docs.yml

name: DocC Runner

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'iOS'
        type: choice
        options:
          - iOS
          - macOS
          - tvOS
          - watchOS
          - xrOS
          - Multiplatform

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine Platform
        id: platform
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ github.event.inputs.platform }}" >> $GITHUB_OUTPUT
          else
            platforms=$(bash scripts/package-platforms.sh -xros)
            platform_count=$(echo "$platforms" | wc -l | tr -d ' ')
            
            if [ "$platform_count" -gt 1 ]; then
              echo "platform=Multiplatform" >> $GITHUB_OUTPUT
            else
              echo "platform=$platforms" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build DocC
        run: |
          if [ "${{ steps.platform.outputs.platform }}" = "Multiplatform" ]; then
            bash scripts/docc-multiplatform.sh
          else
            bash scripts/docc.sh --platform ${{ steps.platform.outputs.platform }}
          fi

      - name: Upload DocC Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.platform.outputs.platform == 'Multiplatform' && '.build/docc' || format('.build/docs-{0}', steps.platform.outputs.platform) }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
